<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie TikTok · Kontekst AI</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<main>
<p class="belka"><a href="index.html">Kontekst AI</a></p>
<h1>Logowanie TikTok</h1>
<p>Jeśli widzisz kod poniżej, logowanie się udało. Skopiuj go i wklej tam, gdzie prosi o niego workflow.</p>
<p><code id="kod">brak kodu w adresie</code></p>
<p class="meta" id="blad"></p>
<script>
const q = new URLSearchParams(location.search);
if (q.get('code')) document.getElementById('kod').textContent = q.get('code');
if (q.get('error')) document.getElementById('blad').textContent = 'Błąd: ' + q.get('error') + ' ' + (q.get('error_description') || '');
</script>
</main>
</body>
</html>
